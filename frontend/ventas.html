<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ventas · Zorros Revolution Biker</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">🦊</span>
      <div><strong>Zorros Revolution</strong><small>AI Predictive Engine</small></div>
    </div>
    <nav class="sidebar-nav">
      <a href="/dashboard.html" data-nav="dashboard">📊 Dashboard</a>
      <a href="/ventas.html" data-nav="ventas">🧾 Ventas</a>
      <a href="/productos.html" data-nav="productos">🏍️ Productos</a>
      <a href="/predicciones.html" data-nav="predicciones" data-roles="admin">📡 Predicciones</a>
    </nav>
    <div class="sidebar-user">
      <div><strong id="nombre-usuario">—</strong><small id="rol-usuario">—</small></div>
      <button id="btn-logout" class="btn-icon" title="Cerrar sesión">⎋</button>
    </div>
  </aside>

  <main class="main-content">
    <header class="topbar">
      <div>
        <h1>Registro de Ventas</h1>
        <p>Gestione y analice las transacciones del negocio</p>
      </div>
      <button class="btn btn-primary" id="btn-nueva-venta">+ Nueva Venta</button>
    </header>

    <section class="panel">
      <table class="data-table">
        <thead>
          <tr>
            <th>Nro.</th><th>Fecha</th><th>Cajero</th><th>Productos</th><th>Total</th><th>Pago</th>
          </tr>
        </thead>
        <tbody id="tabla-ventas">
          <tr><td colspan="6" class="empty-state">Cargando ventas…</td></tr>
        </tbody>
      </table>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal-venta" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2>Nueva venta</h2>
      <button class="btn-icon" id="btn-cerrar-modal">✕</button>
    </div>
    <form id="form-venta">
      <div id="items-venta"></div>
      <button type="button" class="btn btn-ghost" id="btn-agregar-item">+ Agregar producto</button>

      <label for="metodo-pago">Método de pago</label>
      <select id="metodo-pago">
        <option>Efectivo</option>
        <option>Tarjeta</option>
        <option>Transferencia</option>
        <option>Crédito</option>
      </select>

      <p id="venta-error" class="form-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Registrar venta</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/ventas.js"></script>
</body>
</html>
