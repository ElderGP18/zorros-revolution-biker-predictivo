<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zorros Revolution Biker · Iniciar sesión</title>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-icon">🦊</span>
      <div>
        <h1>Zorros Revolution</h1>
        <p>AI Predictive Engine</p>
      </div>
    </div>
    <h2>Iniciar sesión</h2>
    <p class="login-sub">Sistema predictivo de ventas e inventario</p>

    <form id="form-login">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" required autocomplete="username" />

      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <p id="login-error" class="form-error" hidden></p>

      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>

  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
